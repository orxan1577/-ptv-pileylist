
name: IPTV Link Checker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get playlist
        uses: actions/checkout@v4

      - name: Check playlist links
        run: |
          python - <<'PY'
          import re
          import urllib.request

          with open("playlist.m3u", encoding="utf-8") as f:
              text = f.read()

          urls = re.findall(r'(?m)^https?://\S+', text)
          for url in urls:
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      print("OK", r.status, url)
              except Exception as e:
                  print("YOXLAMA UĞURSUZ:", url, e)
          PY
